name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Generate Gradle Wrapper
        run: |
          # 在CI环境中生成gradlew和wrapper jar
          gradle wrapper --gradle-version 8.5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: juexin-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (if triggered)
        if: github.event.inputs.build_type == 'release'
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: juexin-assistant-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## APK构建完成" >> $GITHUB_STEP_SUMMARY
          echo "✅ Debug APK 可在本页底部 Artifacts 区域下载" >> $GITHUB_STEP_SUMMARY
          echo "📱 下载后直接安装到安卓手机即可" >> $GITHUB_STEP_SUMMARY
          echo "🖱️ 首次使用需在设置中授予「悬浮窗」权限" >> $GITHUB_STEP_SUMMARY
