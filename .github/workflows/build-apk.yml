name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: juexin-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (if triggered)
        if: github.event.inputs.build_type == 'release'
        run: gradle assembleRelease --no-daemon

      - name: Sign Release APK
        if: github.event.inputs.build_type == 'release'
        run: |
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: juexin-assistant-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 下载说明" >> $GITHUB_STEP_SUMMARY
          echo "1. 在本页底部 **Artifacts** 区域下载 \`juexin-assistant-debug\`" >> $GITHUB_STEP_SUMMARY
          echo "2. 解压 zip 得到 \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "3. 传到手机安装即可" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装须知" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ 需要 **Android 8.0 及以上**系统" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ 安装时如提示「未知来源」，请允许「浏览器」或「文件管理器」安装未知应用" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ 首次使用需在设置中授予「悬浮窗」权限" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ 如提示「解析包错误」，请检查手机系统是否 >= Android 8.0" >> $GITHUB_STEP_SUMMARY